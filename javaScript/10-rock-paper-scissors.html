<!DOCTYPE html>
<html>
    <head>
        <title>Rock-Paper-Scissors</title>
        <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
    </head>
    <body>

       
        <p class="title">Rock Paper Scissors</p>
        
        <button onclick="
          playGame('rock');
        " class="move-button"><img src="#" alt="Rock" class="move-icon"> </button>


        <button onclick="
       playGame('paper');
       
        "class="move-button"><img src="#" alt="Paper" class="move-icon"> </button>



        <button onclick=" 
        playGame('scissors');
        " class="move-button"><img src="#" alt="Scissors" class="move-icon"></button>
        


        <p class="js-result result"></p>
        <p class="js-moves"></p>
        <p class="js-score score"></p>

        <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;

        updateScoreElement();
        localStorage.removeItem('score');
        "class="reset-score-button">Reset Score</button>
       
    <script src="scripts/10-rock-paper-scissors.js"></script>
    </body>
</html>
